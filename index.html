<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shot Predictor</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3ef; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --line: #e1e0d9; --border: rgba(11,11,11,.10); --chip: #eceae4; --chip-hover: #e2e0d8;
  --sel: #0b0b0b; --sel-ink: #fff;
  --pitch: #e8dbbd; --pitch-edge: #d3c197; --crease: #fffdf6; --grass: #e7eee2; --grass-2: #dbe5d4;
  --ball: #b3261e; --stump: #5b4a2e;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --rest: #c3c2b7;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7; --muted: #898781;
    --line: #2c2c2a; --border: rgba(255,255,255,.10); --chip: #262624; --chip-hover: #30302d;
    --sel: #fff; --sel-ink: #0b0b0b;
    --pitch: #4a4231; --pitch-edge: #62563d; --crease: #d9d2bf; --grass: #1c231b; --grass-2: #232c21;
    --ball: #e0534b; --stump: #d9c9a3;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --rest: #4a4a46;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7; --muted: #898781;
  --line: #2c2c2a; --border: rgba(255,255,255,.10); --chip: #262624; --chip-hover: #30302d;
  --sel: #fff; --sel-ink: #0b0b0b;
  --pitch: #4a4231; --pitch-edge: #62563d; --crease: #d9d2bf; --grass: #1c231b; --grass-2: #232c21;
  --ball: #e0534b; --stump: #d9c9a3;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --rest: #4a4a46;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select { font: inherit; color: inherit; }
header { max-width: 1240px; margin: 0 auto; padding: 18px 16px 6px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
header .sub { color: var(--muted); font-size: 13px; flex: 1; min-width: 160px; }
main { max-width: 1240px; margin: 0 auto; padding: 10px 16px 32px; display: grid; gap: 16px; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); align-items: start; }
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.panel + .panel { margin-top: 12px; }
.label { font-size: 12px; color: var(--muted); margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack > * + * { margin-top: 14px; }

/* chips & segmented controls */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 0; background: var(--chip); border-radius: 999px; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
.chip:hover { background: var(--chip-hover); }
.chip[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink); }
.chip:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; }
.seg .chip { background: transparent; padding: 5px 12px; }
.seg .chip[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink); }
.group-name { font-size: 11px; color: var(--muted); width: 36px; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }

/* inputs */
.field { display: grid; gap: 4px; }
.field span { font-size: 12px; color: var(--muted); }
input[type=text], input[type=number], select { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; min-width: 0; }
input[type=number] { width: 64px; font-variant-numeric: tabular-nums; }
.batter { flex: 1; min-width: 160px; }
.score { display: inline-flex; align-items: center; gap: 2px; }
.score input { width: 56px; }
details summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
details[open] summary { margin-bottom: 10px; }

/* pitch map */
.pitchwrap { display: grid; grid-template-columns: 1fr; justify-items: center; }
#pitch { width: 100%; max-width: 380px; height: auto; touch-action: manipulation; }
#pitch .cell { fill: transparent; cursor: pointer; }
#pitch .cell:hover { fill: var(--ink); fill-opacity: .07; }
#pitch text { fill: var(--ink-2); font-size: 11px; }
#pitch .side { fill: var(--muted); font-size: 10px; letter-spacing: .08em; font-weight: 600; }
.pitchhint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 2px; }

/* this over */
.over { display: flex; gap: 6px; flex-wrap: wrap; }
.ballslot { width: 44px; height: 44px; border-radius: 50%; border: 1.5px dashed var(--line); display: grid; place-items: center; font-size: 11px; color: var(--muted); background: none; padding: 0; }
.ballslot.done { border: 0; background: var(--chip); color: var(--ink); cursor: pointer; line-height: 1.1; }
.ballslot.done:hover { background: var(--chip-hover); }
.ballslot.done b { font-size: 14px; display: block; }
.ballslot.now { border: 2px solid var(--ball); color: var(--ball); font-weight: 600; }
.played { margin-top: 10px; padding: 10px; border-radius: 10px; background: var(--bg); display: none; }
.played.open { display: block; }
.primary { border: 0; background: var(--sel); color: var(--sel-ink); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.ghost { border: 1px solid var(--border); background: none; border-radius: 999px; padding: 7px 12px; cursor: pointer; color: var(--ink-2); }

/* results */
.summary { font-size: 15px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.summary b { font-size: 17px; }
.summary .meta { color: var(--muted); font-size: 13px; }
.notice { font-size: 13px; color: var(--ink-2); background: var(--bg); border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
@media (max-width: 640px) {
  .cards { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .card { display: grid; grid-template-columns: minmax(0, 1fr) 124px; grid-template-areas: "head wheel" "rank wheel" "cap wheel"; column-gap: 12px; align-content: start; }
  .card .head { grid-area: head; } .card .rank { grid-area: rank; } .card .caption { grid-area: cap; margin-top: 6px; }
  .card .wheel, .card .nomap { grid-area: wheel; margin: 0; }
  .card .nomap { padding: 8px; font-size: 12px; }
}
.card { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: var(--surface); position: relative; }
.card .head { display: flex; align-items: center; gap: 8px; }
.card .rank { font-size: 11px; color: var(--muted); }
.card .name { font-weight: 600; font-size: 15px; flex: 1; text-transform: capitalize; }
.card .pct { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.wheel { width: 100%; height: auto; display: block; margin: 6px 0 4px; }
.wheel .wedge { stroke: var(--surface); stroke-width: 2; cursor: default; }
.wheel text { font-size: 9px; fill: var(--ink-2); }
.wheel .zl { font-size: 10px; font-weight: 600; fill: var(--ink); }
.caption { font-size: 12px; color: var(--ink-2); min-height: 32px; }
.caption .m { color: var(--muted); }
.nomap { display: grid; place-items: center; aspect-ratio: 1; color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }
.bars { margin-top: 16px; display: grid; gap: 5px; }
.bar { display: grid; grid-template-columns: 118px 1fr 46px; gap: 10px; align-items: center; font-size: 13px; }
.bar .n { text-transform: capitalize; color: var(--ink-2); }
.bar .t { height: 10px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar .f { display: block; height: 100%; border-radius: 4px; background: var(--rest); transition: width .25s; }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.bar.top .n, .bar.top .v { color: var(--ink); font-weight: 600; }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; padding: 5px 8px; border-radius: 6px; opacity: 0; transition: opacity .1s; z-index: 5; }
@media (min-width: 901px) { #results { position: sticky; top: 12px; } }
.loading { opacity: .55; transition: opacity .15s; }
.err { color: #d03b3b; }
</style>
</head>
<body>
<header>
  <h1>Shot predictor</h1>
  <span class="sub">Set the delivery, see what the batter plays and where the runs go.</span>
  <div class="seg" id="format" role="group" aria-label="Format"></div>
</header>

<main>
  <div>
    <section class="panel stack" aria-label="Batter and bowler">
      <div>
        <p class="label"><span>Batter</span><span id="batinfo"></span></p>
        <div class="row">
          <input type="text" id="batter" class="batter" list="batters" autocomplete="off" aria-label="Batter name" placeholder="Type a name…">
          <div class="seg" id="hand" role="group" aria-label="Batting hand"></div>
        </div>
        <datalist id="batters"></datalist>
      </div>
      <div>
        <p class="label"><span>Bowler</span></p>
        <div class="stack" style="--gap:6px">
          <div class="row"><span class="group-name">Pace</span><div class="chips" id="pace"></div></div>
          <div class="row" style="margin-top:6px"><span class="group-name">Spin</span><div class="chips" id="spin"></div></div>
        </div>
      </div>
      <div>
        <p class="label"><span>Variation</span><span id="varnote"></span></p>
        <div class="chips" id="variation"></div>
      </div>
    </section>

    <section class="panel" aria-label="Delivery">
      <p class="label"><span>Where it pitched</span><span id="pitchtext"></span></p>
      <div class="pitchwrap">
        <svg id="pitch" viewBox="0 0 400 430" tabindex="0" role="application" aria-label="Pitch map. Use arrow keys to change line and length."></svg>
      </div>
      <p class="pitchhint">Click the pitch, or use ← → for line and ↑ ↓ for length</p>
    </section>

    <section class="panel" aria-label="This over">
      <p class="label"><span>This over</span><span id="overtext"></span></p>
      <div class="over" id="overballs"></div>
      <div class="row" style="margin-top:10px">
        <button class="primary" id="playbtn">Ball played →</button>
        <button class="ghost" id="clearover">Clear over</button>
      </div>
      <div class="played" id="played">
        <p class="label"><span>What did the batter play?</span></p>
        <div class="chips" id="playedshot"></div>
        <p class="label" style="margin-top:10px"><span>Runs</span></p>
        <div class="chips" id="playedruns"></div>
      </div>
    </section>

    <section class="panel stack" aria-label="Match situation">
      <div class="row" style="gap:16px">
        <label class="field"><span>Over</span>
          <select id="over"></select>
        </label>
        <div class="field"><span>Innings</span><div class="seg" id="inns" role="group" aria-label="Innings"></div></div>
        <label class="field"><span>Score</span><span class="score"><input type="number" id="runs" min="0" aria-label="Team runs">/<input type="number" id="wkts" min="0" max="9" aria-label="Wickets"></span></label>
        <label class="field" id="targetfield"><span>Target</span><input type="number" id="target" min="1"></label>
      </div>
      <div class="row" style="gap:16px">
        <label class="field"><span>Batter runs</span><input type="number" id="bat_runs" min="0"></label>
        <label class="field"><span>Balls faced</span><input type="number" id="balls_faced" min="0"></label>
      </div>
      <details>
        <summary>Ground &amp; conditions</summary>
        <div class="row">
          <label class="field" style="flex:1"><span>Ground</span><select id="ground"><option value="">Any</option></select></label>
          <label class="field"><span>Day / night</span><select id="daynight"><option value="">Any</option></select></label>
        </div>
      </details>
    </section>
  </div>

  <section class="panel" id="results" aria-live="polite">
    <div class="summary" id="summary"></div>
    <div id="notices"></div>
    <div class="cards" id="cards"></div>
    <p class="label" style="margin-top:18px"><span>All shots</span><span>chance of playing it</span></p>
    <div class="bars" id="bars"></div>
  </section>
</main>
<div id="tip" role="tooltip"></div>

<script>
const $ = s => document.querySelector(s);
const nice = s => s.replace(/_/g, ' ');
// a "leave" against a short or back-of-a-length ball is usually a duck or sway
const shotName = (s, len = S.length) => s === 'leave' && (len === 'SHORT' || len === 'SHORT_OF_A_GOOD_LENGTH') ? 'leave / duck' : nice(s);
const LINES = ['WIDE_OUTSIDE_OFFSTUMP', 'OUTSIDE_OFFSTUMP', 'ON_THE_STUMPS', 'DOWN_LEG', 'WIDE_DOWN_LEG'];
const LENGTHS = ['FULL_TOSS', 'YORKER', 'FULL', 'GOOD_LENGTH', 'SHORT_OF_A_GOOD_LENGTH', 'SHORT']; // batter end first
const LINE_NAME = { WIDE_OUTSIDE_OFFSTUMP: 'wide outside off', OUTSIDE_OFFSTUMP: 'outside off', ON_THE_STUMPS: 'on the stumps', DOWN_LEG: 'down leg', WIDE_DOWN_LEG: 'wide down leg' };
const LINE_SHORT = { WIDE_OUTSIDE_OFFSTUMP: 'wide', OUTSIDE_OFFSTUMP: 'off', ON_THE_STUMPS: 'stumps', DOWN_LEG: 'leg', WIDE_DOWN_LEG: 'wide' };
const LEN_NAME = { FULL_TOSS: 'full toss', YORKER: 'yorker', FULL: 'full', GOOD_LENGTH: 'good length', SHORT_OF_A_GOOD_LENGTH: 'back of a length', SHORT: 'short' };
const LEN_SHORT = { FULL_TOSS: 'FT', YORKER: 'Y', FULL: 'F', GOOD_LENGTH: 'GL', SHORT_OF_A_GOOD_LENGTH: 'BoL', SHORT: 'S' };
const PACE = ['right-arm fast', 'right-arm medium', 'left-arm fast', 'left-arm medium'];
const SPIN = ['off spin', 'leg spin', 'left-arm orthodox', 'left-arm wrist spin'];
const OVERS = { T20: 20, ODI: 50, Test: 200 };
const OVER_STEP = { T20: 1, ODI: 5, Test: 10 }; // over dropdown granularity
const overBin = (o, f = S.format) => { const st = OVER_STEP[f], lo = Math.floor((o - 1) / st) * st + 1; return { lo, hi: Math.min(lo + st - 1, OVERS[f]) }; };
const overLabel = (o = S.over) => { const b = overBin(o); return b.lo === b.hi ? `over ${b.lo}` : `overs ${b.lo}–${b.hi}`; };
const SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)'];

const S = { // default delivery
  format: 'ODI', batter: 'Virat Kohli', bat_hand: 'RHB', bowl_style: 'right-arm fast', variation: 'stock',
  line: 'OUTSIDE_OFFSTUMP', length: 'GOOD_LENGTH', over: 12, inns: 1, runs: 68, wkts: 1, target: 280,
  bat_runs: 32, balls_faced: 40, prev: [], ground: '', daynight: ''
};
let O, hands = {}, last = null;

// ---------- small builders ----------
function chips(el, values, key, label = nice, onPick) {
  el.innerHTML = '';
  for (const v of values) {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = label(v); b.dataset.v = v;
    b.onclick = () => { onPick ? onPick(v) : (S[key] = v); update(); };
    el.append(b);
  }
}
const mark = (el, v) => el.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === String(v))));
const svg = (tag, attrs = {}, text) => {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
};
const tip = $('#tip');
function hoverTip(el, text) {
  el.addEventListener('pointermove', e => { tip.textContent = text; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY + 12 + 'px'; tip.style.opacity = 1; });
  el.addEventListener('pointerleave', () => tip.style.opacity = 0);
}

// ---------- pitch map (view from behind the bowler; batter's stumps at the top) ----------
// not to scale: off / stumps / leg drawn equal width so the ball is easy to place; the wide bands take up the rest
const COLW = [68, 44, 44, 44, 68], ROWS = { FULL_TOSS: [18, 46], YORKER: [58, 92], FULL: [92, 160], GOOD_LENGTH: [160, 248], SHORT_OF_A_GOOD_LENGTH: [248, 322], SHORT: [322, 400] };
const X0 = 14;
function cols() { // off side on the left for a right-hander (as seen from behind the bowler)
  const order = S.bat_hand === 'LHB' ? [...LINES].reverse() : LINES;
  let x = X0; return order.map((l, i) => { const w = S.bat_hand === 'LHB' ? COLW[4 - i] : COLW[i]; const c = { line: l, x, w }; x += w; return c; });
}
function drawPitch() {
  const p = $('#pitch'); p.innerHTML = '';
  const cs = cols(), W = cs.reduce((a, c) => a + c.w, 0);
  const sx = X0 + COLW[0] + COLW[1] - 6, sw = COLW[2] + 12; // pitch strip ~ stumps +/- a bit
  p.append(svg('rect', { x: X0, y: 0, width: W, height: 430, rx: 10, fill: 'var(--grass)' }));
  p.append(svg('rect', { x: X0 + 30, y: 10, width: W - 60, height: 410, rx: 4, fill: 'var(--pitch)', stroke: 'var(--pitch-edge)' }));
  p.append(svg('line', { x1: X0 + 30, x2: X0 + W - 30, y1: 58, y2: 58, stroke: 'var(--crease)', 'stroke-width': 2 }));
  // stumps at the batter's end
  const midx = cs.find(c => c.line === 'ON_THE_STUMPS'); const cx = midx.x + midx.w / 2;
  for (const d of [-7, 0, 7]) p.append(svg('rect', { x: cx + d - 2, y: 28, width: 4, height: 12, rx: 1.5, fill: 'var(--stump)' }));
  // length bands
  for (const L of LENGTHS) {
    const [y1, y2] = ROWS[L];
    if (L !== 'FULL_TOSS') p.append(svg('line', { x1: X0 + 30, x2: X0 + W - 30, y1: y2, y2, stroke: 'var(--pitch-edge)', 'stroke-dasharray': '3 4' }));
    p.append(svg('text', { x: X0 + W + 6, y: (y1 + y2) / 2 + 4 }, LEN_NAME[L]));
  }
  // selected line + length highlight
  const sc = cs.find(c => c.line === S.line), [ly1, ly2] = ROWS[S.length];
  p.append(svg('rect', { x: sc.x, y: 0, width: sc.w, height: 430, fill: 'var(--ball)', 'fill-opacity': .07 }));
  p.append(svg('rect', { x: X0, y: ly1, width: W, height: ly2 - ly1, fill: 'var(--ball)', 'fill-opacity': .07 }));
  // column labels
  cs.forEach(c => p.append(svg('text', { x: c.x + c.w / 2, y: 418, 'text-anchor': 'middle' }, LINE_SHORT[c.line])));
  const offLeft = S.bat_hand !== 'LHB';
  p.append(svg('text', { x: X0 + 4, y: 12, class: 'side' }, offLeft ? 'OFF' : 'LEG'));
  p.append(svg('text', { x: X0 + W - 4, y: 12, class: 'side', 'text-anchor': 'end' }, offLeft ? 'LEG' : 'OFF'));
  // ball
  const bx = sc.x + sc.w / 2, by = (ly1 + ly2) / 2;
  if (S.length === 'FULL_TOSS') p.append(svg('circle', { cx: bx, cy: by, r: 13, fill: 'none', stroke: 'var(--ball)', 'stroke-dasharray': '2 3' }));
  p.append(svg('circle', { cx: bx, cy: by, r: 9, fill: 'var(--ball)' }));
  p.append(svg('path', { d: `M${bx - 6} ${by - 3} Q${bx} ${by + 2} ${bx + 6} ${by - 3}`, stroke: '#fff', 'stroke-width': 1.2, fill: 'none', 'stroke-dasharray': '1.5 1.5', opacity: .8 }));
  // hit cells last so they sit on top
  for (const c of cs) for (const L of LENGTHS) {
    const [y1, y2] = ROWS[L];
    const r = svg('rect', { x: c.x, y: y1, width: c.w, height: y2 - y1, class: 'cell' });
    r.onclick = () => { S.line = c.line; S.length = L; update(); };
    hoverTip(r, `${LEN_NAME[L]}, ${LINE_NAME[c.line]}`);
    p.append(r);
  }
  $('#pitchtext').textContent = `${LEN_NAME[S.length]} · ${LINE_NAME[S.line]}`;
}
$('#pitch').addEventListener('keydown', e => {
  const cs = cols().map(c => c.line), i = cs.indexOf(S.line), j = LENGTHS.indexOf(S.length);
  const moves = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (!moves[e.key]) return;
  e.preventDefault();
  const [dx, dy] = moves[e.key];
  S.line = cs[Math.max(0, Math.min(cs.length - 1, i + dx))];
  S.length = LENGTHS[Math.max(0, Math.min(LENGTHS.length - 1, j + dy))];
  update();
});

// ---------- wagon wheel (same view: bowler at the bottom, off side left for a right-hander) ----------
const ZONE_ANG = { mid_off: [0, 45], cover: [45, 90], point: [90, 135], third_man: [135, 180],
                   mid_on: [0, 45], mid_wicket: [45, 90], square_leg: [90, 135], fine_leg: [135, 180] };
const OFFSIDE = new Set(['mid_off', 'cover', 'point', 'third_man']);
function wheel(share, color, hand) {
  const cx = 100, cy = 96, R = 86, r0 = 10;
  const offSign = hand === 'LHB' ? 1 : -1;
  const e = svg('svg', { viewBox: '0 0 200 204', class: 'wheel', role: 'img' });
  e.append(svg('circle', { cx, cy, r: R + 4, fill: 'var(--grass)' }));
  const pt = (deg, r, s) => { const t = deg * Math.PI / 180; return [cx + s * r * Math.sin(t), cy + r * Math.cos(t)]; };
  const max = Math.max(...Object.values(share));
  const ranked = Object.entries(share).sort((a, b) => b[1] - a[1]);
  for (const [z, v] of Object.entries(share)) {
    const s = OFFSIDE.has(z) ? offSign : -offSign, [a1, a2] = ZONE_ANG[z], sw = s > 0 ? 0 : 1;
    const [x1, y1] = pt(a1, r0, s), [x2, y2] = pt(a1, R, s), [x3, y3] = pt(a2, R, s), [x4, y4] = pt(a2, r0, s);
    const w = svg('path', { class: 'wedge', fill: color, 'fill-opacity': (0.14 + 0.82 * v / max).toFixed(3),
      d: `M${x1} ${y1}L${x2} ${y2}A${R} ${R} 0 0 ${sw} ${x3} ${y3}L${x4} ${y4}A${r0} ${r0} 0 0 ${1 - sw} ${x1} ${y1}Z` });
    hoverTip(w, `${nice(z)}: ${Math.round(v * 100)}% of runs`);
    e.append(w);
  }
  e.append(svg('circle', { cx, cy, r: R * .55, fill: 'none', stroke: 'var(--surface)', 'stroke-opacity': .7, 'stroke-dasharray': '2 3' }));
  e.append(svg('rect', { x: cx - 3, y: cy - 4, width: 6, height: 24, rx: 1, fill: 'var(--pitch)', stroke: 'var(--pitch-edge)', 'stroke-width': .6 }));
  // label the two biggest zones directly
  for (const [z, v] of ranked.slice(0, 2)) {
    const s = OFFSIDE.has(z) ? offSign : -offSign, [a1, a2] = ZONE_ANG[z], [x, y] = pt((a1 + a2) / 2, R * .74, s);
    e.append(svg('text', { x, y: y + 3.5, 'text-anchor': 'middle', class: 'zl' }, Math.round(v * 100) + '%'));
  }
  e.append(svg('text', { x: cx + offSign * (R - 4), y: 12, 'text-anchor': offSign < 0 ? 'start' : 'end' }, 'OFF'));
  e.append(svg('text', { x: cx - offSign * (R - 4), y: 12, 'text-anchor': offSign < 0 ? 'end' : 'start' }, 'LEG'));
  e.append(svg('text', { x: cx, y: 202, 'text-anchor': 'middle' }, 'bowler'));
  e.setAttribute('aria-label', 'Scoring zones: ' + ranked.map(([z, v]) => `${nice(z)} ${Math.round(v * 100)}%`).join(', '));
  return e;
}

// ---------- this over ----------
function drawOver() {
  const el = $('#overballs'); el.innerHTML = '';
  S.prev.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'ballslot done'; b.type = 'button';
    b.innerHTML = `<span><b>${p.runs}</b>${LEN_SHORT[p.length]}</span>`;
    b.setAttribute('aria-label', `Ball ${i + 1}: ${LEN_NAME[p.length]}, ${LINE_NAME[p.line]}, ${shotName(p.shot, p.length)}, ${p.runs} runs. Click to remove.`);
    hoverTip(b, `${LEN_NAME[p.length]}, ${LINE_NAME[p.line]} · ${shotName(p.shot, p.length)} · ${p.runs} run${p.runs === 1 ? '' : 's'} — click to remove`);
    b.onclick = () => { S.prev.splice(i, 1); tip.style.opacity = 0; update(); };
    el.append(b);
  });
  for (let i = S.prev.length; i < 6; i++) {
    const d = document.createElement('div');
    d.className = 'ballslot' + (i === S.prev.length ? ' now' : '');
    d.textContent = i === S.prev.length ? 'now' : i + 1;
    el.append(d);
  }
  $('#overtext').textContent = `${overLabel()} · ball ${S.prev.length + 1}`;
}
$('#playbtn').onclick = () => {
  const box = $('#played'); box.classList.toggle('open');
  if (!box.classList.contains('open')) return;
  const top = last ? last.top.map(t => t.shot) : [];
  const rest = O.classes.filter(c => !top.includes(c));
  chips($('#playedshot'), [...top, ...rest], null, v => shotName(v), v => { box.dataset.shot = v; mark($('#playedshot'), v); });
  box.dataset.shot = top[0] || 'defend'; mark($('#playedshot'), box.dataset.shot);
  chips($('#playedruns'), ['0', '1', '2', '3', '4', '6'], null, String, v => {
    const r = +v;
    S.prev.push({ line: S.line, length: S.length, shot: box.dataset.shot, runs: r });
    S.runs += r; S.bat_runs += r; S.balls_faced += 1;
    if (S.prev.length >= 6) { S.prev = []; S.over = Math.min(S.over + 1, OVERS[S.format]); }
    box.classList.remove('open');
  });
};
$('#clearover').onclick = () => { S.prev = []; update(); };

// ---------- match situation ----------
function bindNum(id) { const el = $('#' + id); el.oninput = () => { if (el.value !== '') { S[id] = +el.value; update(false); } }; }
['runs', 'wkts', 'target', 'bat_runs', 'balls_faced'].forEach(bindNum);
// a range stands for its middle over (the model takes a single over number)
$('#over').onchange = e => { const b = overBin(+e.target.value); S.over = Math.round((b.lo + b.hi) / 2); update(); };
let overFor = null;
function overOptions() {
  if (overFor !== S.format) {
    const opts = [];
    for (let lo = 1; lo <= OVERS[S.format]; lo += OVER_STEP[S.format]) { const b = overBin(lo); opts.push(`<option value="${lo}">${b.lo === b.hi ? lo : `${b.lo}–${b.hi}`}</option>`); }
    $('#over').innerHTML = opts.join(''); overFor = S.format;
  }
  $('#over').value = overBin(S.over).lo;
}
$('#ground').onchange = e => { S.ground = e.target.value; update(); };
$('#daynight').onchange = e => { S.daynight = e.target.value; update(); };
$('#batter').addEventListener('input', e => {
  S.batter = e.target.value.trim();
  if (hands[S.batter]) S.bat_hand = hands[S.batter];
  update(false);
});

// ---------- render everything from S ----------
function clamp() {
  S.over = Math.max(1, Math.min(S.over || 1, OVERS[S.format]));
  if (S.format !== 'Test' && S.inns > 2) S.inns = 2;
}
function update(syncInputs = true) {
  clamp();
  mark($('#format'), S.format); mark($('#hand'), S.bat_hand); mark($('#pace'), S.bowl_style); mark($('#spin'), S.bowl_style);
  mark($('#variation'), S.variation); mark($('#inns'), S.inns);
  const t20 = S.format === 'T20';
  $('#variation').querySelectorAll('.chip').forEach(b => b.disabled = !t20);
  $('#varnote').textContent = t20 ? '' : 'only recorded in T20 data';
  chipsInns();
  $('#targetfield').style.display = S.inns === 2 && S.format !== 'Test' ? '' : 'none';
  overOptions();
  if (syncInputs) for (const k of ['runs', 'wkts', 'target', 'bat_runs', 'balls_faced']) $('#' + k).value = S[k];
  $('#batter').value = S.batter;
  const n = O.batterBalls[S.batter];
  $('#batinfo').textContent = n ? `${n.toLocaleString()} balls in data` : S.batter ? 'not in data' : '';
  drawPitch(); drawOver();
  predictSoon();
}
let innsFor = null;
function chipsInns() {
  const want = S.format === 'Test' ? 4 : 2;
  if (innsFor !== want) { chips($('#inns'), [...Array(want)].map((_, i) => String(i + 1)), null, String, v => S.inns = +v); innsFor = want; }
  mark($('#inns'), S.inns);
}

// ---------- predict ----------
let timer, seq = 0;
function predictSoon() { clearTimeout(timer); timer = setTimeout(predict, 120); }
async function predict() {
  if (!S.batter) return;
  const my = ++seq;
  const body = { format: S.format, batter: S.batter, bat_hand: S.bat_hand, bowl_style: S.bowl_style, line: S.line, length: S.length,
    over: S.over, inns: S.inns, runs: S.runs, wkts: S.wkts, bat_runs: S.bat_runs, balls_faced: S.balls_faced, prev: S.prev,
    variation: S.format === 'T20' ? S.variation : null };
  if (S.inns === 2 && S.format !== 'Test') body.target = S.target;
  if (S.ground) body.ground = S.ground;
  if (S.daynight) body.daynight = S.daynight;
  $('#results').classList.add('loading');
  try {
    const r = await fetch('/predict', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (my !== seq) return; // a newer request is in flight
    $('#results').classList.remove('loading');
    if (!r.ok) { $('#notices').innerHTML = `<p class="notice err">${typeof j.detail === 'string' ? j.detail : j.detail.map(d => d.msg).join('; ')}</p>`; return; }
    last = j; render(j);
  } catch (e) { $('#notices').innerHTML = `<p class="notice err">Can't reach the predictor — is the server running?</p>`; }
}
function render(j) {
  $('#summary').innerHTML = `<b>${LEN_NAME[S.length][0].toUpperCase() + LEN_NAME[S.length].slice(1)}, ${LINE_NAME[S.line]}</b>
    <span class="meta">${S.bowl_style}${S.format === 'T20' && S.variation !== 'stock' ? ' · ' + S.variation : ''} to ${S.batter} (${S.bat_hand}) · ${S.format} · ${overLabel()}, ball ${S.prev.length + 1} · ${S.runs}/${S.wkts}</span>`;
  $('#notices').innerHTML = j.batter_known ? '' : `<p class="notice">${S.batter} isn't in the data, so this is a typical ${S.bat_hand === 'LHB' ? 'left' : 'right'}-hander. Scoring maps show everyone's average.</p>`;
  const cards = $('#cards'); cards.innerHTML = '';
  j.top.forEach((t, i) => {
    const c = document.createElement('article'); c.className = 'card';
    c.innerHTML = `<div class="head"><span class="swatch" style="background:${SERIES[i]}"></span><span class="name">${shotName(t.shot)}</span><span class="pct">${Math.round(t.pct)}%</span></div><div class="rank">#${i + 1} most likely</div>`;
    const cap = document.createElement('div'); cap.className = 'caption';
    if (t.shot === 'leave') {
      c.insertAdjacentHTML('beforeend', `<div class="nomap">${shotName('leave') === 'leave' ? 'A leave' : 'A leave or duck'} doesn't score — no scoring map</div>`);
    } else {
      c.append(wheel(t.share, SERIES[i], S.bat_hand));
      const [z, v] = Object.entries(t.share).sort((a, b) => b[1] - a[1])[0];
      cap.innerHTML = `Mostly through <b>${nice(z)}</b> (${Math.round(v * 100)}%)<br><span class="m">${t.runs >= 40 ? `from ${t.runs.toLocaleString()} of ${S.batter.split(' ').slice(-1)[0]}'s runs` : 'little data for this batter — mostly everyone\'s average'}</span>`;
    }
    c.append(cap); cards.append(c);
  });
  const topIdx = Object.fromEntries(j.top.map((t, i) => [t.shot, i]));
  $('#bars').innerHTML = Object.entries(j.shots).map(([s, p]) => `<div class="bar${s in topIdx ? ' top' : ''}"><span class="n">${shotName(s)}</span>
    <span class="t"><span class="f" style="width:${p}%;${s in topIdx ? `background:${SERIES[topIdx[s]]}` : ''}"></span></span><span class="v">${p < 1 ? '<1' : Math.round(p)}%</span></div>`).join('');
}

// ---------- boot ----------
fetch('/options').then(r => r.json()).then(o => {
  O = o; O.batterBalls = {};
  for (const [n, h, balls] of o.batters) { hands[n] = h; O.batterBalls[n] = balls; }
  $('#batters').innerHTML = o.batters.map(([n]) => `<option value="${n}">`).join('');
  chips($('#format'), o.formats, null, String, v => { S.format = v; });
  chips($('#hand'), ['RHB', 'LHB'], 'bat_hand', String);
  chips($('#pace'), PACE.filter(p => o.bowl_styles.includes(p)), 'bowl_style', v => v.replace('right-arm ', 'Right ').replace('left-arm ', 'Left '));
  chips($('#spin'), SPIN.filter(p => o.bowl_styles.includes(p)), 'bowl_style', v => ({ 'off spin': 'Off spin', 'leg spin': 'Leg spin', 'left-arm orthodox': 'Left-arm orthodox', 'left-arm wrist spin': 'Left-arm wrist' }[v]));
  chips($('#variation'), o.variations.slice(0, 10), 'variation');
  $('#ground').insertAdjacentHTML('beforeend', o.grounds.map(g => `<option>${g}</option>`).join(''));
  $('#daynight').insertAdjacentHTML('beforeend', o.daynight.map(g => `<option>${g}</option>`).join(''));
  update();
});
</script>
</body>
</html>
